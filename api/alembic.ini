# JimQ API Alembic config (single database).
# Run from api/: `uv run alembic upgrade head`.
# Migrations are HAND-WRITTEN per DEV_CONTRACT_AFK 鐵律 2 (never --autogenerate).

[alembic]
script_location = migrations
prepend_sys_path = . src
version_path_separator = os

# sqlalchemy.url is injected from app.core.config in migrations/env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
