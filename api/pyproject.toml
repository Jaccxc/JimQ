[project]
name = "jimq-api"
version = "0.1.0"
description = "JimQ FastAPI backend (fork of FastAPI-boilerplate v0.15.0, stripped). S0 placeholder."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jimq-core",
]

[tool.uv.sources]
jimq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
