# JimQ local infrastructure (S0). localhost-only per DEV_CONTRACT_AFK 鐵律 4/5.
# redis = Nautilus message bus/streams + (separate DB index) boilerplate cache.
# postgres = application data only (trade journal / backtest runs / model registry).
services:
  redis:
    image: redis:7.4-alpine
    container_name: jimq-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: jimq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-jimq}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jimq}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # --- MLflow 實驗追蹤(卡 #16)-----------------------------------------------
  # localhost-only(鐵律 4)。backend store = sqlite 檔(掛在具名 volume 持久化),
  # artifact root = 容器內本地目錄(具名 volume),透過 --serve-artifacts 代理上傳,
  # 故 host 上的 research client 只需指向 http://localhost:5000,無須共享檔案系統路徑。
  # MLflow 3.x 已停用 file tracking store,一律用 sqlite backend。
  # profile=research:預設 `up` 不啟動;以
  # `docker compose --profile research up -d mlflow` 啟動。port 5000 未占用。
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0
    container_name: jimq-mlflow
    profiles: ["research"]
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/db/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow-db:/mlflow/db
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --- FastAPI 後端(卡 #4/#7/#8;#10 容器化)---------------------------------
  # 啟動先 alembic upgrade head(鐵律 2)再 uvicorn。讀 bus DB0(@latest 解析
  # engine 寫入的 stream key)→ consumer → hub → WS。REST /bars 讀共享 catalog volume。
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    container_name: jimq-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-jimq}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CACHE_DB: 1
      # @latest(卡 A 雙 scope):api 起 live + backtest 兩條 supervisor,各從 bus
      # DB0 的 jimq:live:latest_stream_key / jimq:backtest:latest_stream_key 讀對應
      # engine 最近一次寫入的 key,各自 hub 並行消費(Live 不混入 backtest)。
      JIMQ_STREAM_KEY: "@latest"
      JIMQ_CATALOG_PATH: /data/catalog
      ENVIRONMENT: local
    volumes:
      - catalog-data:/data/catalog
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  # --- 前端(卡 #9;#10 容器化)----------------------------------------------
  # Node 18 build → nginx 靜態伺服 + 反代 /api、/ws 到 api。
  web:
    build:
      context: ./web
      dockerfile: ../infra/docker/web/Dockerfile
    container_name: jimq-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # --- engine demo job(卡 #5;#10 一次性 ingest + 串流 backtest)--------------
  # profile=demo:預設 `up` 不啟動;用 `docker compose --profile demo run --rm engine`
  # 或 `up engine` 觸發。跑完寫好 stream + LATEST_STREAM_KEY 後結束。
  engine:
    build:
      context: .
      dockerfile: infra/docker/engine/Dockerfile
    container_name: jimq-engine-demo
    profiles: ["demo"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JIMQ_CATALOG_PATH: /data/catalog
      INGEST_START: ${INGEST_START:-2024-01-01}
      INGEST_END: ${INGEST_END:-2024-01-02}
      EMA_FAST: ${EMA_FAST:-3}
      EMA_SLOW: ${EMA_SLOW:-8}
      JIMQ_SYNTHETIC: ${JIMQ_SYNTHETIC:-0}
    volumes:
      - catalog-data:/data/catalog
    restart: "no"

  # --- engine command worker(卡 #20 W1;控制平面常駐消費端)-------------------
  # 常駐 worker:XREADGROUP 消費 Redis command stream(jimq:commands, bus DB0),
  # 收到 run_backtest 命令時跑啟用 Redis Streams 的 backtest、發布 LATEST_STREAM_KEY、
  # 以 app 級 SQLAlchemy 回寫 backtest_run 狀態(連 postgres)。復用 engine 映像,
  # 覆寫 entrypoint 跑 worker。localhost-only(鐵律 4)。
  command-worker:
    build:
      context: .
      dockerfile: infra/docker/engine/Dockerfile
    container_name: jimq-command-worker
    entrypoint: ["python", "scripts/run_command_worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-jimq}
      JIMQ_CATALOG_PATH: /data/catalog
    volumes:
      - catalog-data:/data/catalog
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  catalog-data:
  mlflow-db:
  mlflow-artifacts:
