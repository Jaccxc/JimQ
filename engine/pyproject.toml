[project]
name = "jimq-engine"
version = "0.1.0"
description = "JimQ NautilusTrader engine: strategies, adapters, nodes, streaming"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jimq-core",
    "nautilus_trader==1.228.0",
    "redis>=5",
    # 卡 #20 (W1) command worker:用 app 級 SQLAlchemy 回寫 backtest_run 狀態
    # (非手動 psql;鐵律 2 精神)。只連 localhost(鐵律 4)。
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29",
]

[tool.uv.sources]
jimq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimq_engine"]
