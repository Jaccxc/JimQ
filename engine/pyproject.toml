[project]
name = "jimq-engine"
version = "0.1.0"
description = "JimQ NautilusTrader engine: strategies, adapters, nodes, streaming"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jimq-core",
    "nautilus_trader==1.228.0",
    "redis>=5",
]

[tool.uv.sources]
jimq-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimq_engine"]
