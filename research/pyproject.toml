[project]
name = "jimq-research"
version = "0.1.0"
description = "JimQ research package: RL/ML training (isolated venv, NOT in root uv workspace)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "mlflow>=2.12",
    "polars>=0.20",
    "jimq-core",
    # research is the experiment-orchestration layer: it reads the shared
    # ParquetDataCatalog (bars + funding) via jimq_engine's catalog helpers and
    # drives nautilus backtests. Both pulled in as editable/pinned deps so the
    # dataset builder reuses the engine's catalog query code (single source of
    # truth) rather than re-reading raw parquet (anti train/serve skew).
    "jimq-engine",
    "nautilus_trader==1.228.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# jimq_core is consumed via a local path dependency (shared feature lib).
# This is a standalone project (its own .venv via `uv sync` in research/),
# intentionally NOT a member of the root uv workspace.
[tool.uv.sources]
jimq-core = { path = "../libs/jimq_core", editable = true }
jimq-engine = { path = "../engine", editable = true }

# CPU-only torch for this card: import-level smoke only. GPU/CUDA wheels are
# deferred until actual training needs them (avoids huge CUDA downloads).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources.torch]
index = "pytorch-cpu"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimq_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
