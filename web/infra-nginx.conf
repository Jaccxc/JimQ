# JimQ web nginx(卡 #10 全棧 demo)。靜態 SPA + 反代 /api、/ws 到 api 服務。
# 前端走同源 fetch('/api/..') / new WebSocket('/ws/stream')(對齊 vite dev proxy),
# 故容器內不需改前端 base URL。api 為 compose 服務名。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST 歷史 bars(#8)。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WS gateway(#7)。需要 Upgrade/Connection header 才能升級 WebSocket。
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
